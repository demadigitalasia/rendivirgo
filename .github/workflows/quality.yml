name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      API_ORIGIN: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Generate Prisma client
        run: npm --prefix api run prisma:generate
      - name: Typecheck web
        run: npm run typecheck
      - name: Check static asset budget
        run: npm run check:asset-budget
      - name: Check SEO utilities
        run: npm run test:seo
      - name: Typecheck API
        run: npm --prefix api run typecheck
      - name: Run API unit tests
        run: npm --prefix api test
      - name: Build API
        run: npm --prefix api run build
      - name: Build web
        run: npm run build
